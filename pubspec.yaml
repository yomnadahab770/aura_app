name: aura_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.0.0
  web_socket_channel: ^3.0.0
  firebase_core: ^3.10.1
  firebase_database: ^11.3.0
  shared_preferences: ^2.2.2
  model_viewer_plus: ^1.7.0  # المكتبة الخاصة بعرض الـ 3D

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ملاحظة: تم حذف مسارات ملفات الـ .glb من هنا
  # لأننا نعتمد الآن على الروابط المباشرة من GitHub (Cloud Hosting)
  assets:
    - assets/images/  # اتركيه لو كان لديكِ صور أخرى في هذا المسار